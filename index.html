<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* [추가] 가계부 스타일 — 참고 앱처럼 다크 기본, 라이트도 지원
   레이아웃: 상단 고정 헤더(기간·요약) + 스크롤 본문 + 하단 탭바, 아이폰 한 손 사용 기준 */
:root {
  --bg: #222429;
  --surface: #2a2c32;
  --raised: #33353c;
  --line: #3a3d44;
  --fg: #f1f1f3;
  --muted: #8a8d96;
  --accent: #f2604c;
  --accent-fg: #ffffff;
  --inc: #5aa2ff;
  --exp: #ff6b5e;
  --warn: #f2b84b;
  --sat: #5aa2ff;
  --sun: #ff6b5e;
  --out: #1a1b1f;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f7; --surface: #ffffff; --raised: #eceef2; --line: #e1e3e8; --fg: #1d1f24; --muted: #7b7f89;
    --accent: #e8503b; --inc: #2f7de1; --exp: #e5483a; --warn: #c98a12; --sat: #2f7de1; --sun: #e5483a; --out: #e6e8ec; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f5f7; --surface: #ffffff; --raised: #eceef2; --line: #e1e3e8; --fg: #1d1f24; --muted: #7b7f89;
  --accent: #e8503b; --inc: #2f7de1; --exp: #e5483a; --warn: #c98a12; --sat: #2f7de1; --sun: #e5483a; --out: #e6e8ec; color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.inc { color: var(--inc); }
.exp { color: var(--exp); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 12px 16px; }
b, strong { font-variant-numeric: tabular-nums; }

.boot { height: 100%; display: grid; place-content: center; text-align: center; gap: 6px; color: var(--muted); }
.boot b { color: var(--fg); font-size: 22px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }

/* 상단 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.title { margin: 0; font-size: 18px; font-weight: 600; text-align: center; padding: 12px 16px 2px; }
.bar-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding-inline: 8px; }
.bar-head .title { padding-inline: 0; }
.bar-head .icon-btn { grid-column: 3; font-size: 26px; }
.period-nav { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; }
.range { font-size: 17px; font-variant-numeric: tabular-nums; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--fg); font-size: 18px; }
.icon-btn.sm { width: 30px; height: 30px; font-size: 13px; color: var(--muted); }
.subtabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.subtabs.two { grid-template-columns: 1fr 1fr; }
.subtabs button { padding: 11px 4px; color: var(--muted); border-bottom: 3px solid transparent; font-size: 15px; }
.subtabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 10px 8px 12px; border-top: 1px solid var(--line); }
.totals label { display: block; font-size: 14px; margin-bottom: 4px; }
.totals b { font-size: 18px; font-weight: 500; }
.content { min-width: 0; }

/* 거래 줄 */
.day { border-bottom: 8px solid var(--surface); }
.day-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dnum { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wd-badge { background: var(--raised); color: var(--muted); font-size: 12px; padding: 3px 7px; border-radius: 4px; }
.wd-badge.sun { color: var(--sun); }
.wd-badge.sat { color: var(--sat); }
.ym { color: var(--muted); font-size: 14px; margin-right: auto; }
.day-head .inc, .day-head .exp { font-size: 14px; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.tx { width: 100%; display: grid; grid-template-columns: 104px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 13px 16px; text-align: left; }
.tx + .tx { border-top: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
.tx:active { background: var(--surface); }
.tx-cat { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tx-cat i, .nobudget i, .stat-name i, .plain-row i, .bbar-label i, .cat-btn i { font-style: normal; font-size: 17px; }
.tx-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tx-main b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-main small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-amt { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 15px; }

/* 달력 */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.wd { text-align: center; font-size: 12px; padding: 4px 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.wd.sun, .dnum.sun { color: var(--sun); }
.wd.sat, .dnum.sat { color: var(--sat); }
.cell { min-height: 76px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 3px; text-align: left; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cell:nth-child(7n + 7) { border-right: 0; }
.cell .dnum { font-size: 13px; font-weight: 400; }
.cell.out { background: var(--out); opacity: .6; } /* [수정] 라이트 모드에서 너무 진하던 색 수정 */
.cell.sel { background: var(--raised); }
.cell.today .dnum::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-left: 3px; vertical-align: middle; }
.vals { display: flex; flex-direction: column; align-items: flex-end; font-size: 11px; line-height: 1.35; font-variant-numeric: tabular-nums; overflow: hidden; }
.vals span { max-width: 100%; overflow: hidden; text-overflow: clip; white-space: nowrap; }
.net { color: var(--fg); }

/* 월별 */
.month-row { width: 100%; display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }
.month-row > span:first-child { text-align: left; display: flex; flex-direction: column; }
.month-row small { color: var(--muted); font-size: 11px; }

/* 플로팅 버튼 */
.fabs { position: fixed; right: max(16px, calc(50% - 264px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; z-index: 6; }
.fab { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 30px; display: grid; place-items: center; box-shadow: 0 6px 18px rgb(0 0 0 / .35); }
.fab.ghost { background: var(--raised); color: var(--fg); }

/* 하단 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; color: var(--muted); font-size: 12px; }
.tab.on { color: var(--accent); }

/* 통계/예산 */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { padding: 8px 6px; border-radius: 8px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.seg button.on.inc-on { background: var(--inc); }
.seg button.on.exp-on { background: var(--exp); }
.seg.big { margin: 10px 16px 0; }
.seg.big button { padding: 9px; font-size: 15px; }
.seg.mini button { padding: 6px 10px; font-size: 13px; }
.budget-hero { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 16px 8px; }
.budget-hero > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.budget-hero small { color: var(--muted); }
.budget-hero strong { font-size: 30px; font-weight: 600; }
.budget-hero .sub { font-size: 13px; }
.bbar { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: end; }
.bbar.main { padding-top: 34px; border-bottom-width: 8px; border-bottom-color: var(--surface); }
.bbar-label { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bbar-label small { color: var(--muted); font-size: 14px; display: flex; gap: 4px; align-items: center; white-space: nowrap; overflow: hidden; }
.bbar-label b { font-size: 16px; font-weight: 500; }
.bbar-track-wrap { position: relative; min-width: 0; }
.bbar-track { position: relative; height: 26px; background: var(--surface); border-radius: 5px; overflow: hidden; }
.bbar-fill { position: absolute; inset: 0 auto 0 0; background: var(--inc); border-radius: 5px; }
.bbar-fill.warn { background: var(--warn); }
.bbar-fill.over { background: var(--exp); }
.bbar-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--muted); opacity: .8; transform: translateX(-1px); }
.pct { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 14px; font-variant-numeric: tabular-nums; }
.bbar-nums { display: flex; justify-content: space-between; margin-top: 6px; font-variant-numeric: tabular-nums; font-size: 15px; }
.today-pin { position: absolute; top: -26px; transform: translateX(-50%); background: var(--raised); color: var(--fg); font-size: 11px; padding: 2px 8px; border-radius: 9px; white-space: nowrap; }
.nobudget { display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.nobudget span { display: flex; gap: 6px; align-items: center; }
.nobudget b { font-weight: 500; }
.stats { padding: 6px 0; }
.stat-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 16px 6px; }
.pct-badge { background: var(--raised); border-radius: 5px; font-size: 12px; text-align: center; padding: 3px 0; font-variant-numeric: tabular-nums; }
.stat-name { display: flex; gap: 5px; align-items: center; min-width: 0; }
.stat-row b { font-weight: 500; }
.stat-track { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--surface); overflow: hidden; }
.stat-track > div { height: 100%; border-radius: 3px; }
.exp-bg { background: var(--exp); }
.inc-bg { background: var(--inc); }

/* 반복 */
.setting-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sec-head { display: flex; justify-content: space-between; padding: 14px 16px 10px; background: var(--surface); color: var(--muted); }
.sec-head b { font-weight: 500; }
.recur-row { display: grid; grid-template-columns: 40px minmax(0, 1fr); align-items: center; padding-left: 12px; border-bottom: 1px solid var(--line); }
.recur-main { display: grid; grid-template-columns: 54px 84px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 12px 16px 12px 4px; text-align: left; min-width: 0; }
.when { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when small { font-size: 11px; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-fg); font-size: 14px; }
.check.done { background: var(--accent); border-color: var(--accent); }

/* 빈 상태 */
.empty { margin: 28px 16px; padding: 22px 18px; background: var(--surface); border-radius: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.empty b { font-size: 16px; }
.empty p { margin: 0 0 6px; color: var(--muted); line-height: 1.55; }

/* 폼 */
.stack { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 24px; }
.panel { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel-head small { color: var(--muted); font-size: 12px; }
.panel .seg { background: var(--raised); }
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.input { width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; min-width: 0; }
.input.mini { padding: 6px 8px; font-size: 14px; margin-top: 6px; width: auto; }
.input.emoji { width: 56px; text-align: center; flex: none; }
.input.area { min-height: 120px; resize: vertical; line-height: 1.5; }
.money { display: flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.money input { flex: 1; min-width: 0; background: none; border: 0; padding: 11px 0; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.money.big input { font-size: 26px; font-weight: 600; padding: 10px 0; }
.money.exp input { color: var(--exp); }
.money.inc input { color: var(--inc); }
.money span { color: var(--muted); }
.money:focus-within { border-color: var(--accent); }
.btn { border-radius: 10px; padding: 12px 16px; font-weight: 600; font-size: 15px; }
.btn.sm { padding: 8px 12px; font-size: 13px; font-weight: 500; }
.btn.full { width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--raised); color: var(--fg); }
.btn.danger { background: var(--exp); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
.note.bad { color: var(--exp); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn, .chip { border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 14px; background: var(--raised); display: inline-flex; align-items: center; gap: 6px; }
.chip-btn.on { border-color: var(--accent); color: var(--accent); }
.chip button { color: var(--muted); font-size: 12px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.cat-btn { display: flex; align-items: center; gap: 5px; padding: 9px 8px; border-radius: 10px; background: var(--raised); border: 1px solid transparent; font-size: 13px; text-align: left; min-width: 0; overflow: hidden; white-space: nowrap; }
.cat-btn.on { border-color: var(--accent); color: var(--accent); }
.rule-add { display: flex; gap: 6px; flex-wrap: wrap; }
.rule-add .input { flex: 1 1 140px; }
.rules { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; }
.rule { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rule b { font-weight: 500; margin-right: auto; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 15px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle i { flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; transition: background .15s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle input:checked + i { background: var(--accent); }
.toggle input:checked + i::after { transform: translateX(18px); }
.toggle input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.tag { font-style: normal; font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px; background: var(--raised); color: var(--muted); margin-left: 6px; vertical-align: middle; }
.tag.bad { color: var(--exp); }
.tag.warn { color: var(--warn); }

/* 시트 */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 1; padding-top: 6px; }
.sheet-head h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
.plain-list { display: flex; flex-direction: column; }
.plain-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 4px; border-bottom: 1px solid var(--line); }
.plain-row span { display: flex; gap: 6px; align-items: center; }
.plain-row b { font-weight: 500; }
.sms-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px; background: var(--surface); border-radius: 12px; }
.sms-row.off { opacity: .5; }
.sms-row input[type="checkbox"] { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.sms-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sms-main b { font-weight: 500; overflow-wrap: anywhere; }
.sms-main small { color: var(--muted); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 380px) {
  .tx { grid-template-columns: 86px minmax(0, 1fr) auto; }
  .recur-main { grid-template-columns: 48px minmax(0, 1fr) auto; }
  .recur-main .tx-cat { display: none; }
  .bbar { grid-template-columns: 92px minmax(0, 1fr); }
}

/* [추가] 서버 버전: 연결·로그인 화면, 단축어 안내 */
.setup { max-width: 520px; margin: 0 auto; padding-block: 28px 40px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }
.setup h1 { margin: 0; font-size: 24px; }
.lead { margin: 0; color: var(--muted); line-height: 1.55; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; row-gap: 6px; align-items: start; }
.steps li::before { content: counter(st); grid-row: span 3; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 13px; font-weight: 600; display: grid; place-items: center; }
.steps b { font-weight: 600; }
.steps span { color: var(--muted); line-height: 1.55; font-size: 14px; overflow-wrap: anywhere; }
.steps em { font-style: normal; color: var(--fg); }
.steps .btn { justify-self: start; }
.steps a { color: var(--inc); }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--raised); padding: 1px 5px; border-radius: 4px; color: var(--fg); }
.guide { display: flex; flex-direction: column; gap: 12px; }
.copy-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.copy-label { font-size: 12px; color: var(--muted); }
.copy-row code { overflow-wrap: anywhere; word-break: break-all; padding: 6px 8px; max-height: 64px; overflow-y: auto; -webkit-user-select: all; user-select: all; }
.input.area.short { min-height: 70px; font-size: 13px; word-break: break-all; }
.failed { display: flex; flex-direction: column; gap: 8px; }
.failed-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; background: var(--raised); border-radius: 10px; padding: 8px 10px; }
.failed-row pre { margin: 0; white-space: pre-wrap; font-family: inherit; font-size: 12px; color: var(--muted); -webkit-user-select: text; user-select: text; }
/* [추가] 파일 선택 버튼 */
.file-btn { display: block; text-align: center; box-sizing: border-box; cursor: pointer; }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.seg button:disabled, .check:disabled { opacity: .35; }
/* [추가] 조건 규칙 입력 */
.rule-form { display: flex; flex-direction: column; gap: 8px; }
.rule-cond { margin-right: 4px; min-width: 0; overflow-wrap: anywhere; }
.rule b { white-space: nowrap; }
/* [추가] 탭 5개 + 정보 탭 */
.tabbar.five { grid-template-columns: repeat(5, 1fr); }
.release { display: flex; flex-direction: column; gap: 8px; }
.release-head { display: flex; align-items: baseline; gap: 8px; }
.release-head b { font-size: 16px; }
.release-head small { color: var(--muted); }
.release ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
.release.current { border: 1px solid var(--accent); }
.now-badge { font-size: 11px; font-weight: 600; color: var(--accent-fg); background: var(--accent); border-radius: 10px; padding: 2px 8px; }
.kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; overflow-wrap: anywhere; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.status-dot.ok { background: #3ec27a; }
.status-dot.bad { background: var(--exp); }
/* [추가] 첫 화면 상단 */
.hero { display: flex; flex-direction: column; gap: 4px; }
.hero-top { display: flex; align-items: center; gap: 10px; }
.hero-top h1 { margin: 0; font-size: 26px; }
.big-tabs button { padding: 10px; font-size: 15px; }
/* [추가] 공휴일 */
.hol { font-size: 9px; color: var(--sun); line-height: 1.1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
.cell { gap: 1px; }
.hol-date { color: var(--muted); font-size: 13px; min-width: 84px; font-variant-numeric: tabular-nums; }
.rule.off b, .rule.off .hol-date { text-decoration: line-through; opacity: .5; }
.vals.long { font-size: 9px; letter-spacing: -0.3px; }

/* [추가] v1.6 — 화면이 좌우로 밀리지 않게, 아이폰 날짜·시간 칸 너비, 분류 3열, 아코디언, 달력 스와이프 */
/* [수정] v1.7: hidden은 스크롤 영역을 하나 더 만들어 헤더가 밀리고 위가 잘렸음 → clip은 스크롤 영역 없이 옆으로만 자름 */
.app, .content, .setup { overflow-x: clip; }
.sheet { overflow-x: hidden; }
.sheet { overscroll-behavior: contain; touch-action: pan-y; }
.sheet > *, .form > *, .field, .panel > *, .acc-body > * { min-width: 0; max-width: 100%; }
.row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-width: 0; width: 100%; display: block; min-height: 46px; text-align: left; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
.rule-add input[type="date"] { flex: 1 1 140px; width: auto; }
.cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cat-btn { min-width: 0; }
.cat-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-btn i { flex: none; }

.panel.acc { padding: 0; gap: 0; }
.acc-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; text-align: left; }
.acc-title { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.acc-title h2 { margin: 0; font-size: 16px; font-weight: 600; }
.acc-title small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-chev { flex: none; color: var(--muted); transition: transform .15s; }
.panel.acc.open .acc-chev { transform: rotate(180deg); }
.acc-body { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; min-width: 0; }
.acc-body .seg { background: var(--raised); }

.cal { touch-action: pan-y; }
.cal.slide-next { animation: cal-next .22s ease-out; }
.cal.slide-prev { animation: cal-prev .22s ease-out; }
@keyframes cal-next { from { transform: translateX(28%); opacity: .3; } to { transform: none; opacity: 1; } }
@keyframes cal-prev { from { transform: translateX(-28%); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cal.slide-next, .cal.slide-prev { animation: none; } }

/* [추가] v1.7 — 아이폰은 16px 미만 입력칸을 누르면 화면을 확대함 */
input, select, textarea, .input, .input.mini, .input.area.short { font-size: 16px; }
.money.big input { font-size: 26px; }
/* [추가] 업데이트 목록 */
.sec-label { color: var(--muted); font-size: 13px; padding: 4px 4px 0; }
.now-badge.inline { margin-left: 8px; vertical-align: middle; }
.rel-stamp { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.rel-items { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
</style>

create table if not exists ledger_docs (
  user_id uuid not null default auth.uid() references auth.users on delete cascade,
  id text not null,
  body jsonb not null,
  updated_at timestamptz not null default now(),

create table if not exists sms_inbox (
  id bigserial primary key,
  user_id uuid not null references auth.users on delete cascade,
  text text not null,
  status text not null default 'new',        -- new | done | failed
  received_at timestamptz not null default now()
);

alter table sms_inbox enable row level security;
drop policy if exists "own inbox" on sms_inbox;
create policy "own inbox" on sms_inbox for all
  using (user_id = auth.uid()) with check (user_id = auth.uid());

  created_at timestamptz not null default now()
);

drop policy if exists "own tokens" on ingest_tokens;

  using (user_id = auth.uid()) with check (user_id = auth.uid());

create or replace function ingest_sms(p_token text, p_text text)
returns text
language plpgsql
security definer
set search_path = public
as $$
declare
  uid uuid;
begin
  select user_id into uid from ingest_tokens where token = p_token;
  if uid is null then
    raise exception 'invalid token';
  end if;
  if p_text is null or length(p_text) = 0 or length(p_text) > 2000 then
    raise exception 'invalid text';
  end if;
  insert into sms_inbox (user_id, text) values (uid, p_text);
  return 'ok';
end;
$$;
revoke all on function ingest_sms(text, text) from public;
